# This fork's iOS build on macos-26: every push to main, and by hand.
# - A push waits 15 minutes on Linux first: pushes come in runs, and each
#   newer one cancels the run still waiting (see concurrency), so a run of
#   pushes makes one build on a Mac, of the last. GitHub turned Actions off
#   for this fork after days of ten Mac builds each. A run started by hand
#   or by the daily sync builds at once, and so does a push whose last
#   commit's message has "[build now]" in it.
# - New code on main cancels the build still running for older code.
# - A build that no Mac ever picked up (GitHub's Macs can be out of capacity
#   for hours) is started again as a run of its own, three tries in all (the
#   "Retry" job). One that failed on a Mac (the code) and one cancelled by
#   newer code or by hand are not.
# - Nothing is built when the app would be the same as the last release's
#   (the "Check" job, .github/scripts/fork-needs-build.sh); a run started by
#   hand with "force" builds anyway.
# The ipa is the run's artifact (iOS-release), and a release: GitHub mails a
# new release to the repository's watchers.
# Each build first merges upstream PiliPlus's new commits, if any (the "Sync
# upstream" step, .github/scripts/fork-merge-upstream.sh), and pushes the
# merge to main once the build has succeeded. The daily sync
# (fork-sync-upstream.yml) starts a build when upstream has something new and
# main has not moved.
name: Fork iOS build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tool/**"
  workflow_dispatch:
    inputs:
      force:
        description: 即使和上一版相同也编译
        type: boolean
        default: false
      attempt:
        description: 第几次尝试（没有 Mac 接任务时由 Retry 自动填，手动运行不用改）
        type: string
        default: "1"

concurrency:
  group: fork-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # The "Retry" job: reads the build job's annotations, starts a run.
  actions: write
  checks: read

jobs:
  # On Linux, plentiful and quick: no Mac is waited for to find out that
  # nothing needs building.
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      # A newer push cancels this run while it waits. A push whose last
      # commit says "[build now]" in its message is not made to wait: the
      # one that is meant to be built, said by whoever pushes it.
      - name: Wait for more pushes
        if: >-
          github.event_name == 'push'
          && !contains(github.event.head_commit.message, '[build now]')
        run: sleep 900

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anything new to build
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: bash .github/scripts/fork-needs-build.sh

  build:
    name: Build
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-26
    outputs:
      on-a-mac: ${{ steps.mac.outputs.on-a-mac }}
    steps:
      # Set as soon as the job runs at all, so that the retry can tell a job
      # no Mac picked up from one that failed on it.
      - name: Note that a Mac picked up the job
        id: mac
        shell: bash
        run: echo "on-a-mac=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Sync upstream
        id: upstream
        shell: bash
        run: bash .github/scripts/fork-merge-upstream.sh

      - name: Build
        uses: ./.github/actions/fork-build-ios
        with:
          release: "true"
          push-merge: ${{ steps.upstream.outputs.merged }}

  retry:
    name: Retry
    needs: [check, build]
    # A build no Mac picked up ends "cancelled", not "failure" ("The job was
    # not acquired by Runner of type hosted even after multiple attempts"),
    # and a job after it was skipped both times it was needed: with
    # failure(), and with !cancelled() (run 45209414237). always() it is,
    # on Linux and for a few seconds: such a job runs in a cancelled run too
    # and cannot be cancelled, and what it finds there is told apart below.
    if: >-
      always() && needs.check.outputs.build == 'true'
      && (needs.build.result == 'failure' || needs.build.result == 'cancelled')
      && needs.build.outputs.on-a-mac != 'true'
    runs-on: ubuntu-latest
    steps:
      # A run of its own, as the daily sync starts one: it waits for a Mac
      # anew, and newer code or a hand cancels it like any other.
      - name: Start the build again
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          # Into variables, not pipes to grep or head: one that stops reading
          # early fails the pipe (pipefail), whatever it found.
          job=$(gh api "$api/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[] | select(.name == "Build") | .id][0] // empty')
          notes=""
          if [ -n "$job" ]; then
            notes=$(gh api "$api/check-runs/$job/annotations" --jq '.[].message')
          fi
          # Said by GitHub of a job no runner took; a build cancelled by
          # newer code or by hand while it waited has no such note.
          if [[ "$notes" != *"not acquired by Runner"* ]]; then
            echo "The build was not left without a Mac: not started again." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_REF" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME has moved on to $head: its own run builds it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "**连续 $ATTEMPT 次没有 Mac 接这个编译，不再自动重试。**稍后手动运行这个工作流。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          gh workflow run -R "$GITHUB_REPOSITORY" fork-ios.yml --ref "$GITHUB_REF_NAME" \
            -f attempt="$((ATTEMPT + 1))" -f force="$FORCE"
          echo "没有 Mac 接第 $ATTEMPT 次编译，已开始第 $((ATTEMPT + 1)) 次。" >> "$GITHUB_STEP_SUMMARY"
