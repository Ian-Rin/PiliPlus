# This fork's iOS build on macos-26: every push to main, and by hand.
# - A push waits 15 minutes on Linux first: pushes come in runs, and each
#   newer one cancels the run still waiting (see concurrency), so a run of
#   pushes makes one build on a Mac, of the last. GitHub turned Actions off
#   for this fork after days of ten Mac builds each. A run started by hand
#   or by the daily sync builds at once.
# - New code on main cancels the build still running for older code.
# - A build that no Mac ever picked up (GitHub's Macs can be out of capacity
#   for hours) is tried once more. One that failed on a Mac (the code) and one
#   cancelled by newer code are not.
# - Nothing is built when the app would be the same as the last release's
#   (the "Check" job, .github/scripts/fork-needs-build.sh); a run started by
#   hand with "force" builds anyway.
# The ipa is the run's artifact (iOS-release), and a release: GitHub mails a
# new release to the repository's watchers.
# Each build first merges upstream PiliPlus's new commits, if any (the "Sync
# upstream" step, .github/scripts/fork-merge-upstream.sh), and pushes the
# merge to main once the build has succeeded. The daily sync
# (fork-sync-upstream.yml) starts a build when upstream has something new and
# main has not moved.
name: Fork iOS build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tool/**"
  workflow_dispatch:
    inputs:
      force:
        description: 即使和上一版相同也编译
        type: boolean
        default: false

concurrency:
  group: fork-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # On Linux, plentiful and quick: no Mac is waited for to find out that
  # nothing needs building.
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      # A newer push cancels this run while it waits.
      - name: Wait for more pushes
        if: github.event_name == 'push'
        run: sleep 900

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anything new to build
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: bash .github/scripts/fork-needs-build.sh

  build:
    name: Build
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-26
    outputs:
      on-a-mac: ${{ steps.mac.outputs.on-a-mac }}
    steps:
      # Set as soon as the job runs at all, so that the retry can tell a job
      # no Mac picked up from one that failed on it.
      - name: Note that a Mac picked up the job
        id: mac
        shell: bash
        run: echo "on-a-mac=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Sync upstream
        id: upstream
        shell: bash
        run: bash .github/scripts/fork-merge-upstream.sh

      - name: Build
        uses: ./.github/actions/fork-build-ios
        with:
          release: "true"
          push-merge: ${{ steps.upstream.outputs.merged }}

  retry:
    name: Retry
    needs: [check, build]
    # A build no Mac picked up ends "cancelled", not "failure" ("The job was
    # not acquired by Runner of type hosted even after multiple attempts"),
    # and failure() was false for it: the retry was skipped the one time it
    # was needed. cancelled() is the run's: true for a run that newer code
    # cancelled, whose build ends "cancelled" too and is not tried again.
    if: >-
      !cancelled() && needs.check.outputs.build == 'true'
      && (needs.build.result == 'failure' || needs.build.result == 'cancelled')
      && needs.build.outputs.on-a-mac != 'true'
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Sync upstream
        id: upstream
        shell: bash
        run: bash .github/scripts/fork-merge-upstream.sh

      - name: Build
        uses: ./.github/actions/fork-build-ios
        with:
          release: "true"
          push-merge: ${{ steps.upstream.outputs.merged }}
