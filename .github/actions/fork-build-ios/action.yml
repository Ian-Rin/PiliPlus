# The steps of upstream's .github/workflows/ios.yml, for this fork's own
# workflows (fork-ios.yml). Kept apart so that upstream's file stays as it is
# and the daily sync does not conflict on it; when upstream changes its build
# steps, change them here too.
name: Build unsigned iOS IPA
description: Flutter iOS release build without code signing, zipped as an ipa and uploaded.

inputs:
  release:
    description: Also publish the ipa as a GitHub release, which mails the repository's watchers.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    - name: Set and Extract version
      shell: pwsh
      run: lib/scripts/build.ps1

    - name: Apply Patch
      shell: pwsh
      run: lib/scripts/patch.ps1 iOS

    - name: Build iOS
      shell: bash
      run: |
        flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
        ln -sf ./build/ios/iphoneos Payload
        # make AltSign happy...
        find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
        zip -r9 PiliPlus_ios_${{ env.version }}.ipa Payload/Runner.app

    - name: Upload ios release
      uses: actions/upload-artifact@v7
      with:
        archive: false
        name: iOS-release
        path: PiliPlus_ios_*.ipa

    # One release per commit (the build number is the commit count). GitHub
    # mails a new release to the repository's watchers, its owner among them;
    # the ipa is a plain download there, without signing in.
    - name: Publish release
      if: inputs.release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # The shell runs with -e and pipefail: a grep that finds nothing, or a
      # head that stops reading early, would end the step.
      run: |
        code="${version##*+}"
        name="${version%+*}"
        name="${name%.lemontea}"
        tag="v${name}-${code}"
        ipa="$(ls PiliPlus_ios_*.ipa)"
        git fetch -q --tags origin || true
        previous=""
        for t in $(git tag -l 'v*' --sort=-creatordate); do
          if [ "$t" != "$tag" ]; then previous="$t"; break; fi
        done
        notes="$RUNNER_TEMP/release-notes.md"
        {
          echo "iOS 未签名 ipa，提交 ${GITHUB_SHA::9}。"
          echo
          if [ -n "$previous" ]; then
            echo "自 $previous 以来："
            echo
            git log --no-merges --max-count=40 --format='- %s' "$previous..$GITHUB_SHA"
          else
            echo "最近的提交："
            echo
            git log --no-merges --max-count=15 --format='- %s' "$GITHUB_SHA"
          fi
        } > "$notes"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" "$ipa" --clobber
        else
          gh release create "$tag" "$ipa" --target "$GITHUB_SHA" \
            --title "PiliPlus $name ($code)" --notes-file "$notes"
        fi
        echo "已发布：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
