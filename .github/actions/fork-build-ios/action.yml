# The steps of upstream's .github/workflows/ios.yml, for this fork's own
# workflows (fork-ios.yml). Kept apart so that upstream's file stays as it is
# and the daily sync does not conflict on it; when upstream changes its build
# steps, change them here too.
name: Build unsigned iOS IPA
description: Flutter iOS release build without code signing, zipped as an ipa and uploaded.

inputs:
  release:
    description: Also publish the ipa as a GitHub release, which mails the repository's watchers.
    required: false
    default: "false"
  sync-upstream:
    description: Merge upstream PiliPlus's new commits before building, and push the merge to main once the build has succeeded.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    # Nothing new upstream: the build goes on as it is. A merge that
    # conflicts, or breaks thread-ripper's tests, is left out (the build goes
    # on without it; the run's page says why), as is one that changes
    # upstream's workflow files, which GITHUB_TOKEN may not push: the daily
    # sync (fork-sync-upstream.yml) reports those. The merge reaches main only
    # after the build (see "Push the upstream merge").
    - name: Merge upstream
      id: upstream
      if: inputs.sync-upstream == 'true'
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # The fork keeps its own README (.gitattributes: merge=ours).
        git config merge.ours.driver true
        git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git 2>/dev/null || true
        git fetch -q upstream main
        if git merge-base --is-ancestor upstream/main HEAD; then
          echo "上游没有新提交，直接编译。" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        commits="$(git log --oneline HEAD..upstream/main)"
        workflows="$(git diff --name-only HEAD...upstream/main -- .github/workflows)"
        if [ -n "$workflows" ]; then
          {
            echo "上游有新提交，但改了工作流文件，编译用的令牌推不上去，这次不合并（交给每天的同步流程）："
            echo '```'
            echo "$workflows"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        before="$(git rev-parse HEAD)"
        if ! git merge -q --no-edit upstream/main; then
          {
            echo "**上游合并有冲突，这次不合并，只编译本仓库的代码。**冲突的文件："
            echo '```'
            git diff --name-only --diff-filter=U
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git merge --abort
          exit 0
        fi
        if ! (cd packages/thread_ripper && dart pub get && dart test); then
          echo "**合并上游后线程撕裂者的测试失败，这次不合并，只编译本仓库的代码。**" >> "$GITHUB_STEP_SUMMARY"
          git reset -q --hard "$before"
          exit 0
        fi
        {
          echo "已合并上游的新提交（编译成功后推送到 main）："
          echo '```'
          echo "$commits"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        echo "merged=true" >> "$GITHUB_OUTPUT"

    - name: Set and Extract version
      shell: pwsh
      run: lib/scripts/build.ps1

    - name: Apply Patch
      shell: pwsh
      run: lib/scripts/patch.ps1 iOS

    - name: Build iOS
      shell: bash
      run: |
        flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
        ln -sf ./build/ios/iphoneos Payload
        # make AltSign happy...
        find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
        zip -r9 PiliPlus_ios_${{ env.version }}.ipa Payload/Runner.app

    - name: Upload ios release
      uses: actions/upload-artifact@v7
      with:
        archive: false
        name: iOS-release
        path: PiliPlus_ios_*.ipa

    # With GITHUB_TOKEN: its push starts no new build of the same code.
    - name: Push the upstream merge
      if: steps.upstream.outputs.merged == 'true'
      shell: bash
      run: |
        if git push -q origin HEAD:main; then
          echo "上游合并已推送到 main。" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "**上游合并没推上 main（main 上有了更新的提交），这次的 ipa 不发布。**" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    # One release per commit (the build number is the commit count). GitHub
    # mails a new release to the repository's watchers, its owner among them;
    # the ipa is a plain download there, without signing in.
    - name: Publish release
      if: inputs.release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # The shell runs with -e and pipefail: a grep that finds nothing, or a
      # head that stops reading early, would end the step.
      run: |
        # The merge commit, when upstream was merged (HEAD is GITHUB_SHA otherwise).
        sha="$(git rev-parse HEAD)"
        code="${version##*+}"
        name="${version%+*}"
        name="${name%.lemontea}"
        tag="v${name}-${code}"
        ipa="$(ls PiliPlus_ios_*.ipa)"
        git fetch -q --tags origin || true
        previous=""
        for t in $(git tag -l 'v*' --sort=-creatordate); do
          if [ "$t" != "$tag" ]; then previous="$t"; break; fi
        done
        notes="$RUNNER_TEMP/release-notes.md"
        {
          echo "iOS 未签名 ipa，提交 ${sha::9}。"
          echo
          if [ -n "$previous" ]; then
            echo "自 $previous 以来："
            echo
            git log --no-merges --max-count=40 --format='- %s' "$previous..$sha"
          else
            echo "最近的提交："
            echo
            git log --no-merges --max-count=15 --format='- %s' "$sha"
          fi
        } > "$notes"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" "$ipa" --clobber
        else
          gh release create "$tag" "$ipa" --target "$sha" \
            --title "PiliPlus $name ($code)" --notes-file "$notes"
        fi
        echo "已发布：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
