# The steps of upstream's .github/workflows/ios.yml, for this fork's own
# workflows (fork-ios.yml). Kept apart so that upstream's file stays as it is
# and the daily sync does not conflict on it; when upstream changes its build
# steps, change them here too.
name: Build unsigned iOS IPA
description: Flutter iOS release build without code signing, zipped as an ipa and uploaded.

inputs:
  release:
    description: Also publish the ipa as a GitHub release, which mails the repository's watchers.
    required: false
    default: "false"
  push-merge:
    description: Push the checkout's upstream merge (made by fork-ios.yml's "Sync upstream" step) to main once the build has succeeded.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    - name: Set and Extract version
      shell: pwsh
      run: lib/scripts/build.ps1

    - name: Apply Patch
      shell: pwsh
      run: lib/scripts/patch.ps1 iOS

    - name: Build iOS
      shell: bash
      # Xcode downloads the Swift packages' binaries (GitHub release assets)
      # on every build, and GitHub answers one with a 504 now and then: the
      # build is tried again then, up to three times. Any other failure ends
      # it at once.
      run: |
        log="$RUNNER_TEMP/flutter-build-ios.log"
        for attempt in 1 2 3; do
          if flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub 2>&1 | tee "$log"; then
            break
          fi
          if [ "$attempt" -lt 3 ] && grep -qE 'resolve (Swift Package Manager|package) dependencies' "$log"; then
            echo "::warning::Swift 包下载失败（第 $attempt 次），60 秒后重试"
            sleep 60
            continue
          fi
          exit 1
        done
        ln -sf ./build/ios/iphoneos Payload
        # make AltSign happy...
        find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
        zip -r9 PiliPlus_ios_${{ env.version }}.ipa Payload/Runner.app

    - name: Upload ios release
      uses: actions/upload-artifact@v7
      with:
        archive: false
        name: iOS-release
        path: PiliPlus_ios_*.ipa

    # With GITHUB_TOKEN: its push starts no new build of the same code.
    - name: Push the upstream merge
      if: inputs.push-merge == 'true'
      shell: bash
      run: |
        if git push -q origin HEAD:main; then
          echo "上游合并已推送到 main。" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "**上游合并没推上 main（main 上有了更新的提交），这次的 ipa 不发布。**" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    # One release per commit (the build number is the commit count). GitHub
    # mails a new release to the repository's watchers, its owner among them;
    # the ipa is a plain download there, without signing in.
    - name: Publish release
      if: inputs.release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # The shell runs with -e and pipefail: a grep that finds nothing, or a
      # head that stops reading early, would end the step. gh is told the
      # repository: it would otherwise pick one from the git remotes.
      run: |
        # The merge commit, when upstream was merged (HEAD is GITHUB_SHA otherwise).
        sha="$(git rev-parse HEAD)"
        code="${version##*+}"
        name="${version%+*}"
        name="${name%.lemontea}"
        tag="v${name}-${code}"
        ipa="$(ls PiliPlus_ios_*.ipa)"
        git fetch -q --tags origin || true
        previous=""
        for t in $(git tag -l 'v*' --sort=-creatordate); do
          if [ "$t" != "$tag" ]; then previous="$t"; break; fi
        done
        notes="$RUNNER_TEMP/release-notes.md"
        {
          echo "iOS 未签名 ipa，提交 ${sha::9}。"
          echo
          if [ -n "$previous" ]; then
            echo "自 $previous 以来："
            echo
            git log --no-merges --max-count=40 --format='- %s' "$previous..$sha"
          else
            echo "最近的提交："
            echo
            git log --no-merges --max-count=15 --format='- %s' "$sha"
          fi
        } > "$notes"
        if gh release view -R "$GITHUB_REPOSITORY" "$tag" >/dev/null 2>&1; then
          gh release upload -R "$GITHUB_REPOSITORY" "$tag" "$ipa" --clobber
        else
          gh release create -R "$GITHUB_REPOSITORY" "$tag" "$ipa" --target "$sha" \
            --title "PiliPlus $name ($code)" --notes-file "$notes"
        fi
        echo "已发布：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
